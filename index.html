<section id="films" class="section">
  <h2>🎬 ITT NEWS Films</h2>
  <p class="muted">Hitamo filime, ihite ikinira hano kuri website.</p>

  <input id="filmSearch" type="search" placeholder="Shaka filime...">

  <div class="film-layout">
    <div class="film-player">
      <h3 id="filmTitle">Hitamo filime</h3>

      <video id="filmPlayer" controls playsinline preload="metadata">
        Browser yawe ntishyigikira video player.
      </video>

      <p id="filmDescription">
        Filime wahisemo izakinira aha.
      </p>

      <p id="filmStatus" aria-live="polite">
        Tegereje guhitamo filime.
      </p>

      <p id="filmCredit"></p>
    </div>

    <div id="filmGrid" class="film-grid"></div>
  </div>
</section>
